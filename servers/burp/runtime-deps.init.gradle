// sandbox-ai-mcp (servers/burp/Dockerfile): lists the jars of the extension's runtime class path - what its fat jar
// is made of - for check_dependencies.py, one "GROUP:MODULE:VERSION PATH" per line, into build/runtime-deps.txt.
allprojects {
    tasks.register("sandboxAiRuntimeDeps") {
        def artifacts = project.configurations.getByName("runtimeClasspath").incoming.artifacts
        def out = project.layout.buildDirectory.file("runtime-deps.txt")
        doLast {
            def lines = artifacts.artifacts.collect { artifact ->
                def id = artifact.id.componentIdentifier
                if (!(id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier)) {
                    throw new GradleException("not a module from a repository: ${id}")
                }
                "${id.group}:${id.module}:${id.version} ${artifact.file.absolutePath}"
            }.sort()
            out.get().asFile.text = lines.join("\n") + "\n"
        }
    }
}
